name: Sync fixtures and results
# Publishes the upcoming fixtures with the model's forecast (docs/football/weekly.json, used by the weekly tournament) and,
# when the repository secrets SUPABASE_URL and SUPABASE_SERVICE_KEY are set, also writes them to the database (src/40_sync_fixtures.py).
on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 src/40_sync_fixtures.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Publish the weekly forecast file
        run: |
          git config user.name "ballknowledge bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/football/weekly.json
          git diff --cached --quiet || (git commit -m "Weekly tournament: model forecasts for upcoming fixtures" && git pull --rebase && git push)
