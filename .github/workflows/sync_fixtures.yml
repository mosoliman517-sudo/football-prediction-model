name: Sync fixtures and results
# Publishes the upcoming fixtures with the model's forecast and fills in finished results (src/40_sync_fixtures.py).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_SERVICE_KEY (Settings, Secrets and variables, Actions).
on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 src/40_sync_fixtures.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
