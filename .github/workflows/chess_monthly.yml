name: Monthly chess refresh
# The FIDE top-100 lists come out at the start of each month. This re-reads them with every player's rating history
# (src/79), refetches the year's tournaments from Lichess (src/81), rebuilds the public chess page and commits it.
# Public sources, no secrets. src/79 is slow (FIDE answers slowly), so the job can take about 40 minutes.
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 src/79_chess_ratings.py
      - run: python3 src/81_chess_events.py
      - run: python3 src/73_build_chess.py --public
      - name: Commit if anything changed
        run: |
          git config user.name "ballknowledge bot"
          git config user.email "bot@users.noreply.github.com"
          git add 02_processed_data/chess_ratings.json 02_processed_data/chess_events.json docs/chess/index.html
          git diff --cached --quiet || (git commit -m "Monthly chess refresh: FIDE lists and tournaments" && git push)
