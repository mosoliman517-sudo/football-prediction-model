name: Weekly photo refresh
# Picks the newest available portrait for every quiz player (src/44_refresh_photos.py) and commits docs/data/photos.json,
# which the live page loads when it opens, so photos stay current without rebuilding the site. No secrets needed.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: python3 src/44_refresh_photos.py
      - name: Commit if the photo list changed
        run: |
          git config user.name "ballknowledge bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/photos.json
          git diff --cached --quiet || (git commit -m "Weekly photo refresh" && git push)
