name: Weekly player facts refresh
# Downloads the latest Transfermarkt dataset files, re-runs the fact pipeline (current clubs, managers, titles, cups, teammates, finals lineups, Champions League brackets),
# checks about 110 certain facts (src/46_audit_quiz_data.py, the job stops and commits nothing if one fails) and commits the small JSON results.
# The raw CSV files are NOT committed. To put the new facts on the live page, rebuild it locally: python3 src/30_build_arena.py --public, then push.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Download the dataset files
        run: |
          B=https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data
          mkdir -p 01_data_market_value/new
          for f in clubs games players transfers; do curl -sf -o $f.csv.gz $B/$f.csv.gz && gunzip -f $f.csv.gz && mv $f.csv 01_data_market_value/$f.csv; done
          for f in appearances game_lineups game_events; do curl -sf -o $f.csv.gz $B/$f.csv.gz && gunzip -f $f.csv.gz && mv $f.csv 01_data_market_value/new/$f.csv; done
      - name: Rebuild the facts
        run: |
          python3 src/34_build_quiz_data.py
          python3 src/47_build_match_facts.py
          python3 src/34_build_quiz_data.py
          python3 src/45_fix_stale_transfers.py
          python3 src/34_build_quiz_data.py
          python3 src/46_audit_quiz_data.py
          python3 src/49_build_xi.py
          python3 src/50_build_bracket.py
          python3 src/52_build_highlights.py
      - name: Commit the JSON results if they changed
        run: |
          git config user.name "ballknowledge bot"
          git config user.email "bot@users.noreply.github.com"
          git add 02_processed_data/quiz_data.json 02_processed_data/match_facts.json 02_processed_data/transfer_fixes.json 02_processed_data/xi.json 02_processed_data/bracket.json 02_processed_data/highlights.json
          git diff --cached --quiet || (git commit -m "Weekly player facts refresh" && git push)
